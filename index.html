<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --green: #4ade80;
            --red: #f87171;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 550px; }
        h2, h3 { text-align: center; margin-bottom: 15px; }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .summary-item h4 { margin: 0 0 5px 0; font-size: 12px; opacity: 0.8; }
        .summary-item p { margin: 0; font-weight: bold; font-size: 15px; }

        .income { color: var(--green); }
        .expense { color: var(--red); }
        .savings { color: var(--accent); }

        form, .auth-box { display: flex; flex-direction: column; gap: 10px; }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .logout-btn { background: var(--red); color: #fff; }
        .reset-btn { background: #e11d48; color: #fff; width: 100%; margin-top: 10px; }
        .delete-btn { 
            background: var(--red); 
            color: #fff; 
            padding: 6px 10px; 
            font-size: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            border: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }

        th, td {
            padding: 10px 4px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th { background: #0f172a; }
        .hidden { display: none; }
        
        .selector-box {
            margin-bottom: 10px;
        }
        .selector-box select, .selector-box input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Auth View (Login / Signup) -->
    <div id="authScreen" class="card">
        <h2 id="authTitle">Login / Sign Up</h2>
        <div class="auth-box">
            <input type="email" id="emailInput" placeholder="Enter Email" required>
            <input type="password" id="passInput" placeholder="Enter Password" required>
            <button onclick="login()">Login</button>
            <button style="background: #64748b; color: #fff;" onclick="signup()">Create New Account</button>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="hidden">
        <h2>Monthly Budget Tracker</h2>

        <!-- Month Overview & Filter -->
        <div class="card">
            <div class="selector-box">
                <label style="font-size: 12px; color: var(--accent);">Select Month to View Overview:</label>
                <select id="monthSelect" onchange="changeSelectedMonth()"></select>
            </div>
            
            <h3 id="currentMonthTitle">Overview</h3>
            <div class="summary-box">
                <div class="summary-item">
                    <h4>Salary/Income</h4>
                    <p class="income" id="totalSalary">Rs 0</p>
                </div>
                <div class="summary-item">
                    <h4>Expenses</h4>
                    <p class="expense" id="totalExpense">Rs 0</p>
                </div>
                <div class="summary-item">
                    <h4>Savings</h4>
                    <p class="savings" id="totalSavings">Rs 0</p>
                </div>
            </div>
            <!-- Reset Button -->
            <button class="reset-btn" onclick="resetCurrentMonth()">🔄 Reset Selected Month to 0</button>
        </div>

        <!-- Input Form -->
        <div class="card">
            <h3>Add Entry</h3>
            <form id="budgetForm">
                <label style="font-size: 12px; color: var(--accent);">Select Date:</label>
                <input type="date" id="entryDate" required>
                <select id="type">
                    <option value="salary">Salary / Income</option>
                    <option value="expense">Expense</option>
                </select>
                <input type="text" id="description" placeholder="Description (e.g. Salary, Rent)" required>
                <input type="number" id="amount" placeholder="Amount (Rs)" required>
                <button type="submit">Save Entry</button>
            </form>
        </div>

        <!-- Monthly History Ledger -->
        <div class="card">
            <h3>Monthly History Ledger</h3>
            <div class="selector-box">
                <input type="text" id="searchInput" onkeyup="filterLedger()" placeholder="🔍 Search month...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Salary</th>
                        <th>Expense</th>
                        <th>Savings</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ledgerTable"></tbody>
            </table>
        </div>

        <!-- Account Security / Change Password -->
        <div class="card">
            <h3>Account Settings</h3>
            <div class="auth-box">
                <input type="password" id="oldPassInput" placeholder="Current (Old) Password">
                <input type="password" id="newPassInput" placeholder="New Password">
                <button onclick="changePassword()">Change Password</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

</div>

<script>
    // Real Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDHdUBGQs9pGTZtJvExY7rXuOuk5QM8990",
        authDomain: "my-monthly-budget-75294.firebaseapp.com",
        databaseURL: "https://my-monthly-budget-75294-default-rtdb.firebaseio.com",
        projectId: "my-monthly-budget-75294",
        storageBucket: "my-monthly-budget-75294.firebasestorage.app",
        messagingSenderId: "971970220243",
        appId: "1:971970220243:web:a3a0bc1392d2092ad04426",
        measurementId: "G-PR8L28H884"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const now = new Date();
    const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const currentMonthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });

    // Set default date input to today
    document.getElementById('entryDate').valueAsDate = new Date();

    let selectedMonthKey = currentMonthKey;
    let currentUser = null;
    let appData = { activeMonthKey: currentMonthKey, months: {} };

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadCloudData();
        } else {
            currentUser = null;
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
        }
    });

    function login() {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passInput').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    function signup() {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passInput').value;
        auth.createUserWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    function logout() {
        auth.signOut();
    }

    function changePassword() {
        const oldPass = document.getElementById('oldPassInput').value;
        const newPass = document.getElementById('newPassInput').value;

        if (!oldPass || !newPass) return alert("Dono password enter karein!");

        const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);

        currentUser.reauthenticateWithCredential(credential).then(() => {
            currentUser.updatePassword(newPass).then(() => {
                alert("Password successfully change ho gaya hai!");
                document.getElementById('oldPassInput').value = '';
                document.getElementById('newPassInput').value = '';
            }).catch(err => alert(err.message));
        }).catch(() => {
            alert("Purana password galat hai!");
        });
    }

    function loadCloudData() {
        db.ref('users/' + currentUser.uid).on('value', snapshot => {
            const data = snapshot.val();
            if (data) {
                appData = data;
            }
            if (!appData.months) appData.months = {};
            if (!appData.months[currentMonthKey]) {
                appData.months[currentMonthKey] = {
                    name: currentMonthName,
                    salary: 0,
                    expenses: 0,
                    savings: 0
                };
            }
            populateMonthDropdown();
            updateUI();
        });
    }

    function populateMonthDropdown() {
        const monthSelect = document.getElementById('monthSelect');
        monthSelect.innerHTML = '';
        
        Object.keys(appData.months).sort().reverse().forEach(mKey => {
            const m = appData.months[mKey];
            const option = document.createElement('option');
            option.value = mKey;
            option.text = m.name;
            if (mKey === selectedMonthKey) option.selected = true;
            monthSelect.appendChild(option);
        });
    }

    function changeSelectedMonth() {
        selectedMonthKey = document.getElementById('monthSelect').value;
        updateUI();
    }

    function saveData() {
        db.ref('users/' + currentUser.uid).set(appData);
    }

    function resetCurrentMonth() {
        if (confirm("Kya aap is month ka balance zero (0) karna chahte hain?")) {
            if (appData.months[selectedMonthKey]) {
                appData.months[selectedMonthKey].salary = 0;
                appData.months[selectedMonthKey].expenses = 0;
                appData.months[selectedMonthKey].savings = 0;
                saveData();
            }
        }
    }

    function deleteMonthRecord(mKey) {
        if (confirm(`Kya aap ${appData.months[mKey].name} ka record delete karna chahte hain?`)) {
            delete appData.months[mKey];
            if (selectedMonthKey === mKey) {
                const keys = Object.keys(appData.months);
                selectedMonthKey = keys.length > 0 ? keys[0] : currentMonthKey;
            }
            saveData();
        }
    }

    function updateUI() {
        const activeData = appData.months[selectedMonthKey] || { name: 'Month', salary: 0, expenses: 0, savings: 0 };
        activeData.savings = activeData.salary - activeData.expenses;

        document.getElementById('currentMonthTitle').innerText = activeData.name + " Overview";
        document.getElementById('totalSalary').innerText = `Rs ${activeData.salary}`;
        document.getElementById('totalExpense').innerText = `Rs ${activeData.expenses}`;
        document.getElementById('totalSavings').innerText = `Rs ${activeData.savings}`;

        renderLedger();
    }

    function renderLedger() {
        const ledgerBody = document.getElementById('ledgerTable');
        const filterVal = document.getElementById('searchInput').value.toLowerCase();
        ledgerBody.innerHTML = '';

        Object.keys(appData.months).sort().reverse().forEach(mKey => {
            const m = appData.months[mKey];
            m.savings = m.salary - m.expenses;
            
            if (m.name.toLowerCase().includes(filterVal)) {
                const row = `<tr>
                    <td><b>${m.name}</b></td>
                    <td class="income">Rs ${m.salary}</td>
                    <td class="expense">Rs ${m.expenses}</td>
                    <td class="savings">Rs ${m.savings}</td>
                    <td><button class="delete-btn" onclick="deleteMonthRecord('${mKey}')">Delete</button></td>
                </tr>`;
                ledgerBody.innerHTML += row;
            }
        });
    }

    function filterLedger() {
        renderLedger();
    }

    document.getElementById('budgetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const entryDateVal = document.getElementById('entryDate').value;
        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);

        if (!amount || amount <= 0 || !entryDateVal) return;

        const dateParts = entryDateVal.split('-');
        const targetMonthKey = `${dateParts[0]}-${dateParts[1]}`;
        const dateObj = new Date(dateParts[0], parseInt(dateParts[1]) - 1, dateParts[2]);
        const targetMonthName = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });

        if (!appData.months[targetMonthKey]) {
            appData.months[targetMonthKey] = { name: targetMonthName, salary: 0, expenses: 0, savings: 0 };
        }

        const currentData = appData.months[targetMonthKey];

        if (type === 'salary') {
            currentData.salary += amount;
        } else {
            currentData.expenses += amount;
        }

        document.getElementById('description').value = '';
        document.getElementById('amount').value = '';
        selectedMonthKey = targetMonthKey;

        saveData();
    });
</script>

</body>
</html>
