<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --green: #4ade80;
            --red: #f87171;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h2, h3 { text-align: center; margin-bottom: 15px; }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .summary-item h4 { margin: 0 0 5px 0; font-size: 12px; opacity: 0.8; }
        .summary-item p { margin: 0; font-weight: bold; font-size: 16px; }

        .income { color: var(--green); }
        .expense { color: var(--red); }
        .savings { color: var(--accent); }

        form { display: flex; flex-direction: column; gap: 10px; }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th { background: #0f172a; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monthly Budget Tracker</h2>

    <!-- Current Month Overview -->
    <div class="card">
        <h3 id="currentMonthTitle">Current Month</h3>
        <div class="summary-box">
            <div class="summary-item">
                <h4>Salary/Income</h4>
                <p class="income" id="totalSalary">Rs 0</p>
            </div>
            <div class="summary-item">
                <h4>Expenses</h4>
                <p class="expense" id="totalExpense">Rs 0</p>
            </div>
            <div class="summary-item">
                <h4>Savings</h4>
                <p class="savings" id="totalSavings">Rs 0</p>
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="card">
        <h3>Add Entry</h3>
        <form id="budgetForm">
            <select id="type">
                <option value="salary">Salary / Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="text" id="description" placeholder="Description (e.g. November Salary, Grocery)" required>
            <input type="number" id="amount" placeholder="Amount (Rs)" required>
            <button type="submit">Save Entry</button>
        </form>
    </div>

    <!-- Monthly Ledger / History -->
    <div class="card">
        <h3>Monthly History Ledger</h3>
        <table>
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Salary</th>
                    <th>Expenses</th>
                    <th>Savings</th>
                </tr>
            </thead>
            <tbody id="ledgerTable">
                <!-- History loaded via JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const now = new Date();
    const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const currentMonthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });

    document.getElementById('currentMonthTitle').innerText = currentMonthName;

    let appData = JSON.parse(localStorage.getItem('budgetAppData')) || {
        activeMonthKey: currentMonthKey,
        months: {}
    };

    // Auto Check: 1st Date or New Month Reset
    if (appData.activeMonthKey !== currentMonthKey) {
        appData.activeMonthKey = currentMonthKey;
    }

    if (!appData.months[currentMonthKey]) {
        appData.months[currentMonthKey] = {
            name: currentMonthName,
            salary: 0,
            expenses: 0,
            savings: 0,
            logs: []
        };
    }

    function saveData() {
        localStorage.setItem('budgetAppData', JSON.stringify(appData));
        updateUI();
    }

    function updateUI() {
        const currentData = appData.months[currentMonthKey];
        
        currentData.savings = currentData.salary - currentData.expenses;

        document.getElementById('totalSalary').innerText = `Rs ${currentData.salary}`;
        document.getElementById('totalExpense').innerText = `Rs ${currentData.expenses}`;
        document.getElementById('totalSavings').innerText = `Rs ${currentData.savings}`;

        const ledgerBody = document.getElementById('ledgerTable');
        ledgerBody.innerHTML = '';

        Object.keys(appData.months).sort().reverse().forEach(mKey => {
            const m = appData.months[mKey];
            const row = `<tr>
                <td><b>${m.name}</b></td>
                <td class="income">Rs ${m.salary}</td>
                <td class="expense">Rs ${m.expenses}</td>
                <td class="savings">Rs ${m.savings}</td>
            </tr>`;
            ledgerBody.innerHTML += row;
        });
    }

    document.getElementById('budgetForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const type = document.getElementById('type').value;
        const desc = document.getElementById('description').value;
        const amount = parseFloat(document.getElementById('amount').value);

        if (!amount || amount <= 0) return;

        const currentData = appData.months[currentMonthKey];

        if (type === 'salary') {
            currentData.salary += amount;
        } else {
            currentData.expenses += amount;
        }

        currentData.logs.push({ type, desc, amount, date: new Date().toLocaleDateString() });

        document.getElementById('description').value = '';
        document.getElementById('amount').value = '';

        saveData();
    });

    updateUI();
</script>

</body>
</html>
